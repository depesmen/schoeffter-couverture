<!DOCTYPE html>

<head>

<link rel="canonical" href="https://www.schoeffter-toiture.fr/avis">

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: Helvetica, Arial, sans-serif;
    color: #333333;
    background: #F4F6FB;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #FFFFFF;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(42, 70, 224, 0.10);
    padding: 40px 32px;
    text-align: center;

  .logo { width: 120px; height: auto; margin: 0 auto 22px; display: block; }
  .stars { font-size: 28px; letter-spacing: 4px; color: #FBBC05; margin: 0 0 18px; }
  h1 { margin: 0 0 14px; font-size: 23px; font-weight: 800; letter-spacing: -0.01em; color: #333333; }
  p { margin: 0 0 28px; font-size: 16px; line-height: 1.55; color: #5a5a5a; }
  .btn {

    font-weight: 700;
    text-decoration: none;
    padding: 16px 24px;
    border-radius: 10px;
    transition: background 0.15s ease;
