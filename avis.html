<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laisser un avis | SAS Schoeffter</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://www.schoeffter-toiture.fr/avis">
<!-- Redirection de secours si le JavaScript est désactivé -->
<meta http-equiv="refresh" content="1; url=https://search.google.com/local/writereview?placeid=ChIJaXnzKJTflEcR-JOHZHuQzBs">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: Helvetica, Arial, sans-serif;
    color: #333333;
    background: #F4F6FB;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #FFFFFF;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(42, 70, 224, 0.10);
    padding: 40px 32px;
    text-align: center;
  }
  .logo { width: 120px; height: auto; margin: 0 auto 24px; display: block; }
  h1 { margin: 0 0 10px; font-size: 22px; font-weight: 800; letter-spacing: -0.01em; color: #333333; }
  p { margin: 0 0 24px; font-size: 16px; line-height: 1.5; color: #5a5a5a; }
  .stars { font-size: 26px; letter-spacing: 3px; color: #FBBC05; margin: 0 0 18px; }
  .btn {
    display: inline-block;
    background: #2A46E0;
    color: #FFFFFF;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 10px;
    transition: background 0.15s ease;
  }
  .btn:hover { background: #1c33ad; }
  .spinner {
    width: 26px; height: 26px;
    margin: 0 auto 18px;
    border: 3px solid #e3e8f5;
    border-top-color: #2A46E0;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/logo.png" alt="Logo SAS Schoeffter, couvreur à Metz">
    <div class="stars" aria-hidden="true">★★★★★</div>
    <h1>Merci de votre confiance</h1>
    <div class="spinner" aria-hidden="true"></div>
    <p>Redirection vers Google pour laisser votre avis…</p>
    <a class="btn" href="https://search.google.com/local/writereview?placeid=ChIJaXnzKJTflEcR-JOHZHuQzBs">Laisser mon avis sur Google</a>
  </main>
  <script>
    // Redirection immédiate, sans ajouter d'entrée dans l'historique (le bouton retour
    // renvoie à la page précédente, pas à cette page de transit).
    window.location.replace("https://search.google.com/local/writereview?placeid=ChIJaXnzKJTflEcR-JOHZHuQzBs");
  </script>
</body>
</html>
